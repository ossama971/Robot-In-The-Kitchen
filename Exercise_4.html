<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Exercise 4 - Animation &amp; Interaction</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script
      async
      src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import { initExercise4 } from "./exercise4.js";

      const { scene, camera, renderer, controls, animateRobot } =
        initExercise4();

      // TODO 9: animateRobot() must be called every frame BEFORE render.
      function animate() {
        requestAnimationFrame(animate);
        animateRobot(); // called every frame BEFORE render
        controls.update(); // smooth orbit damping
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
